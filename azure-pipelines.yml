trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

# Bygger och testar appen
- stage: Build
  displayName: 'Build and test'
  jobs:
  - job: BuildJob
    steps:

    # Hämtar paket
    - script: dotnet restore
      displayName: 'Restore dependencies'

    # Bygger projektet
    - script: dotnet build --configuration Release --no-restore
      displayName: 'Build'

    # Kör testerna
    - script: dotnet test --configuration Release --no-build
      displayName: 'Run tests'

    # Gör appen klar för deployment
    - task: DotNetCoreCLI@2
      displayName: 'Publish application'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
        zipAfterPublish: true

    # Sparar appen som artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/publish'
        artifact: 'webapp'
        publishLocation: 'pipeline'

# Deployar appen till Azure
- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployWebApp
    steps:

    # Hämtar artifacten
    - task: DownloadPipelineArtifact@2
      displayName: 'Download artifact'
      inputs:
        buildType: 'current'
        artifactName: 'webapp'
        targetPath: '$(Pipeline.Workspace)/webapp'

    # Skickar appen till App Service
    - task: AzureWebApp@1
      displayName: 'Deploy to Azure Web App'
      inputs:
        azureSubscription: 'AzureUppgiftServiceConnection'
        appType: 'webAppLinux'
        appName: 'azureuppgift-hiba-api'
        package: '$(Pipeline.Workspace)/webapp/**/*.zip'